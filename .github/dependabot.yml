# Updates for the SHA-pinned GitHub Actions (workflows and action.yml) and for Cargo
# dependencies (design v5 §5 "Supply chain"). Security updates are opened as they appear.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: build
