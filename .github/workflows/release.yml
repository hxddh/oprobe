name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Verify & Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_tests: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            run_tests: true
          - os: macos-latest
            target: aarch64-apple-darwin
            run_tests: true
          - os: macos-latest
            target: x86_64-apple-darwin
            run_tests: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            run_tests: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Lint with Clippy (-D warnings)
        if: matrix.run_tests
        run: cargo clippy --all-targets -- -D warnings

      - name: Run full unit & white-box integration test suite
        if: matrix.run_tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release --bin oprobe --target ${{ matrix.target }}

      - name: End-to-end CLI smoke test (run + tune + diff)
        if: matrix.run_tests
        run: |
          cargo run --release --bin oprobe -- run --profile profiles/memory-quickstart.toml --rounds 8 --json baseline.json --markdown report.md --csv metrics.csv --quiet
          cargo run --release --bin oprobe -- tune --profile profiles/memory-quickstart.toml --trial-rounds 4 --emit-profile tuned.toml --emit-rust operator.rs --emit-python operator.py --json candidate.json --quiet
          cargo run --release --bin oprobe -- run --profile tuned.toml --rounds 8 --quiet
          cargo run --release --bin oprobe -- diff baseline.json baseline.json

      - name: Package release archive (Unix)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        run: |
          STAGE="oprobe-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "${STAGE}"
          cp "target/${{ matrix.target }}/release/oprobe" "${STAGE}/"
          cp README.md CHANGELOG.md LICENSE "${STAGE}/"
          cp -r profiles "${STAGE}/"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Package release archive (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $Stage = "oprobe-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/oprobe.exe" "$Stage/"
          Copy-Item README.md, CHANGELOG.md, LICENSE "$Stage/"
          Copy-Item -Recurse profiles "$Stage/"
          Compress-Archive -Path "$Stage" -DestinationPath "$Stage.zip"
          Get-FileHash "$Stage.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $Stage.zip" } | Set-Content "$Stage.zip.sha256"

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            oprobe-*.tar.gz*
            oprobe-*.zip*

  publish-github-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for changelog
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: dist/*
