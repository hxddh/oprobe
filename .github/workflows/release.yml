name: Release

# Builds platform-native artifacts for a version tag and publishes a GitHub release:
#   oprobe-<ver>-<target>.tar.gz / .zip      portable archives (binary, man pages, completions, profiles)
#   oprobe-<ver>-universal-apple-darwin.tar.gz + oprobe-<ver>-macos-universal.pkg
#   oprobe_<ver>-1_<arch>.deb, oprobe-<ver>-1.<arch>.rpm
#   oprobe-<ver>-x64.msi, oprobe-<ver>-arm64.msi    (Start menu shortcut opens the window)
#   oprobe-<ver>-macos-universal.dmg                 (oprobe.app; same binary as the .pkg)
#   oprobe-desktop-<ver>-x86_64-unknown-linux-gnu.tar.gz  (Linux build with windows; needs GTK 4)
# One binary everywhere: macOS and Windows builds include native windows (`--features gui`);
# Linux packages stay headless (CLI + terminal workbench) so servers need no GTK.
#   SHA256SUMS, oprobe.rb (Homebrew formula), oprobe.cask.rb (Homebrew cask for the .dmg),
#   oprobe.json (Scoop manifest), winget-manifests.zip (submit to microsoft/winget-pkgs),
#   latest.json (index of every asset with URL, size and SHA-256), install.sh, install.ps1
# Every asset gets a SLSA build provenance attestation (`gh attestation verify FILE --repo …`).
# Nothing is code-signed (no Apple/Microsoft certificates): docs/install.md explains the first open.
# Release notes are the CHANGELOG section of the version.

# How a release starts:
#   * merging to main a commit whose Cargo.toml version has no `v<version>` tag yet: the `plan`
#     job creates the tag (with this workflow's token) and the same run builds and publishes;
#   * pushing a `v*` tag by hand;
#   * running the workflow manually (optionally naming an existing tag to rebuild).
# Pushes to main whose version is already tagged stop after `plan`.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build, e.g. v2.0.0 (default: the version in Cargo.toml, tagged if missing)"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      release: ${{ steps.p.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"
          else tag="v$crate"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            if [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ]; then
              echo "$tag is already tagged; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "creating $tag at $GITHUB_SHA"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "oprobe ${tag#v}" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  meta:
    name: Version & extras
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        shell: bash
        run: |
          version="${TAG#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $crate"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --all-targets
      - name: Generate man pages and shell completions
        run: |
          cargo build --release --locked
          mkdir -p dist/extras/man dist/extras/completions
          ./target/release/oprobe man --out-dir dist/extras/man
          for sh in bash zsh fish powershell elvish; do
            ./target/release/oprobe completions "$sh" > "dist/extras/completions/$(case $sh in
              bash) echo oprobe.bash;; zsh) echo _oprobe;; fish) echo oprobe.fish;;
              powershell) echo _oprobe.ps1;; elvish) echo oprobe.elv;; esac)"
          done
          ls -R dist/extras
      - uses: actions/upload-artifact@v4
        with:
          name: extras
          path: dist/extras

  build:
    name: ${{ matrix.target }}
    needs: [plan, meta]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, deb: amd64, rpm: x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, deb: arm64, rpm: aarch64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-latest, target: aarch64-apple-darwin, features: gui }
          - { os: macos-latest, target: x86_64-apple-darwin, features: gui }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, msi: x64, features: gui }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, msi: arm64, features: gui }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/download-artifact@v4
        with:
          name: extras
          path: dist/extras

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="oprobe-${VERSION}-${{ matrix.target }}"
          mkdir -p "stage/$name"
          cp "target/${{ matrix.target }}/release/oprobe" "stage/$name/"
          cp README.md CHANGELOG.md LICENSE "stage/$name/"
          cp -r dist/extras/man dist/extras/completions profiles docs "stage/$name/"
          tar -C stage -czf "$name.tar.gz" "$name"
          mkdir -p out && mv "$name.tar.gz" out/
          mkdir -p bin && cp "target/${{ matrix.target }}/release/oprobe" "bin/oprobe-${{ matrix.target }}"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "oprobe-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "stage/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/oprobe.exe" "stage/$name/"
          Copy-Item README.md, CHANGELOG.md "stage/$name/"
          Copy-Item LICENSE "stage/$name/LICENSE.txt"
          Copy-Item dist/extras/completions/_oprobe.ps1 "stage/$name/"
          Copy-Item -Recurse profiles, docs "stage/$name/"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "stage/$name" -DestinationPath "out/$name.zip"

      - name: MSI
        if: matrix.msi
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2   # <Files> needs WiX 5
          $name = "oprobe-$env:VERSION-${{ matrix.target }}"
          wix build packaging/windows/oprobe.wxs -arch ${{ matrix.msi }} `
            -d Version=$env:VERSION -d BinDir="stage/$name" -d IconFile=packaging/desktop/oprobe.ico `
            -o "out/oprobe-$env:VERSION-${{ matrix.msi }}.msi"
          # WiX also writes a debug database next to the MSI; it is not a release asset.
          Remove-Item out/*.wixpdb -ErrorAction SilentlyContinue

      - name: Debian & RPM packages
        if: matrix.deb
        shell: bash
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output out/
          mkdir -p target/release && cp "target/${{ matrix.target }}/release/oprobe" target/release/oprobe
          cargo generate-rpm --target ${{ matrix.target }} -o out/
          ls out

      - name: Smoke test packaged binary
        if: "!contains(matrix.target, 'aarch64-pc-windows')"
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/oprobe"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" run memory:// -d 1s --warmup 200ms -q -o json --no-save > /dev/null
          "$bin" run memory:// -d 1s --warmup 200ms -q -o html --no-save | grep -q '<svg class="viz"'

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: out/*
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: bin-${{ matrix.target }}
          path: bin/*

  macos-universal:
    name: macOS universal (tar.gz + pkg + dmg)
    needs: [plan, meta, build]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with: { pattern: "bin-*", merge-multiple: true, path: bin }
      - uses: actions/download-artifact@v4
        with: { name: extras, path: dist/extras }
      - name: lipo + archive + pkg
        run: |
          lipo -create bin/oprobe-aarch64-apple-darwin bin/oprobe-x86_64-apple-darwin -output oprobe
          chmod +x oprobe && lipo -info oprobe && ./oprobe --version
          name="oprobe-${VERSION}-universal-apple-darwin"
          mkdir -p "stage/$name" out
          cp oprobe README.md CHANGELOG.md LICENSE "stage/$name/"
          cp -r dist/extras/man dist/extras/completions profiles docs "stage/$name/"
          tar -C stage -czf "out/$name.tar.gz" "$name"
          root=pkgroot/usr/local
          mkdir -p "$root/bin" "$root/share/man/man1" "$root/share/zsh/site-functions" "$root/share/oprobe/profiles"
          cp oprobe "$root/bin/"
          cp dist/extras/man/*.1 "$root/share/man/man1/"
          cp dist/extras/completions/_oprobe "$root/share/zsh/site-functions/"
          cp profiles/*.toml "$root/share/oprobe/profiles/"
          pkgbuild --root pkgroot --identifier io.github.hxddh.oprobe --version "$VERSION" \
            --install-location / "out/oprobe-${VERSION}-macos-universal.pkg"
      - name: oprobe.app + disk image (unsigned preview; see docs/install.md)
        run: |
          mkdir -p dmg
          scripts/macos-app.sh oprobe "$VERSION" dmg
          ln -s /Applications dmg/Applications
          # hdiutil's own size estimate for -srcfolder can come out too small ("No space left on
          # device" while copying the universal binary): size the image explicitly with headroom.
          size_mb=$(( $(du -sm dmg | cut -f1) * 2 + 32 ))
          hdiutil create -volname "oprobe $VERSION" -srcfolder dmg -fs HFS+ -size "${size_mb}m" \
            -ov -format UDZO "out/oprobe-${VERSION}-macos-universal.dmg"
          hdiutil verify "out/oprobe-${VERSION}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-universal-apple-darwin
          path: out/*

  linux-desktop:
    name: Linux desktop build (GTK 4)
    needs: [plan, meta]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - run: cargo build --release --locked --features gui
      - name: Tarball with .desktop entry, icon and install.sh
        run: |
          name="oprobe-desktop-${VERSION}-x86_64-unknown-linux-gnu"
          d="stage/$name"
          mkdir -p "$d/bin" "$d/share/applications" "$d/share/icons/hicolor/512x512/apps" out
          cp target/release/oprobe "$d/bin/"
          cp packaging/desktop/io.github.hxddh.oprobe.desktop "$d/share/applications/"
          cp packaging/desktop/oprobe.png "$d/share/icons/hicolor/512x512/apps/io.github.hxddh.oprobe.png"
          cp LICENSE README.md "$d/"
          printf '#!/bin/sh\n# Install for the current user: ./install.sh  (or PREFIX=/usr/local sudo ./install.sh)\nset -e\np="${PREFIX:-$HOME/.local}"\ncd "$(dirname "$0")"\nmkdir -p "$p"\ncp -r bin share "$p/"\necho "installed oprobe (with its window, GTK 4.14+ required) to $p/bin"\n' > "$d/install.sh"
          chmod +x "$d/install.sh"
          ./target/release/oprobe --version
          tar -C stage -czf "out/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-desktop
          path: out/*

  publish:
    name: Publish GitHub release
    needs: [plan, meta, build, macos-universal, linux-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # build provenance attestations
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with: { pattern: "dist-*", merge-multiple: true, path: out }
      - name: Checksums, Homebrew formula + cask, Scoop, winget, latest.json, installers
        run: |
          cp scripts/install.sh scripts/install.ps1 out/
          (cd out && sha256sum * | sort -k2 > SHA256SUMS)
          scripts/release-manifests.sh "$VERSION" out "${{ github.repository }}"
          # The checksums cover the generated manifests too.
          (cd out && rm SHA256SUMS && sha256sum * | sort -k2 > SHA256SUMS)
          cat out/SHA256SUMS
      - name: Build provenance (SLSA) for every asset
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[?v?"v {f=1; next} f && /^## / {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "oprobe $VERSION" > notes.md
          {
            echo
            echo "---"
            echo "**Install:** \`curl -fsSL https://github.com/${{ github.repository }}/releases/download/v$VERSION/install.sh | sh\` ·"
            echo "Windows: \`winget install hxddh.oprobe\` or the \`.msi\` · update: \`oprobe self-update\`."
            echo "The macOS and Windows packages are not code-signed; first open: [docs/install.md](https://github.com/${{ github.repository }}/blob/v$VERSION/docs/install.md#first-open-of-unsigned-packages)."
            echo "Verify: \`sha256sum -c SHA256SUMS --ignore-missing\` and \`gh attestation verify <file> --repo ${{ github.repository }}\`."
          } >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: oprobe ${{ env.VERSION }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true
      # `uses: hxddh/oprobe@v3` (the GitHub Action) follows the newest 3.x release.
      - name: Move the floating major tag
        if: ${{ !contains(env.VERSION, '-') }}
        run: |
          major="v${VERSION%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git tag -f "$major" "${TAG}^{commit}"
          git push -f origin "refs/tags/$major"

  crates-io:
    name: Publish to crates.io
    needs: [plan, publish]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN not set; skipping crates.io publish"; exit 0
          fi
          cargo publish --locked
