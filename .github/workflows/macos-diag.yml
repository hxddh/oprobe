name: macOS launch diagnosis (temporary)
on:
  push:
    branches: [claude/oprobe-v2-release-l67be8]
    paths: [.github/workflows/macos-diag.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-15
    steps:
      - name: Download released dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.0.0 -R "$GITHUB_REPOSITORY" -p '*macos-universal.dmg'
          hdiutil attach -nobrowse -mountpoint /tmp/m oprobe-*.dmg >/dev/null
          cp -R /tmp/m/oprobe.app /tmp/oprobe.app
      - name: Direct, no arguments, stdout to a file
        run: |
          set +e
          echo "SSH_CONNECTION=${SSH_CONNECTION:-<unset>}"
          perl -e 'alarm 8; exec @ARGV' /tmp/oprobe.app/Contents/MacOS/oprobe > d.out 2> d.err
          echo "code=$?"; echo '--- out'; head -c 3000 d.out; echo '--- err'; head -c 3000 d.err
      - name: Via LaunchServices with captured output
        run: |
          set +e
          open --stdout /tmp/o.out --stderr /tmp/o.err /tmp/oprobe.app
          sleep 6
          pgrep -fl oprobe.app && echo ALIVE || echo GONE
          echo '--- out'; head -c 3000 /tmp/o.out; echo '--- err'; head -c 3000 /tmp/o.err
          pkill -f oprobe.app
      - name: Via LaunchServices, explicit gui argument
        run: |
          set +e
          open --stdout /tmp/g.out --stderr /tmp/g.err /tmp/oprobe.app --args gui
          sleep 6
          pgrep -fl oprobe.app && echo ALIVE || echo GONE
          echo '--- out'; head -c 3000 /tmp/g.out; echo '--- err'; head -c 3000 /tmp/g.err
          screencapture -x gui-arg.png
          pkill -f oprobe.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag
          path: "*.png"
