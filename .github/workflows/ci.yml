name: CI

# Per pull request (design v5 §10): fmt + clippy, tests on Linux, macOS and Windows in debug with
# cargo-nextest, docs, cargo-deny, the GUI build check, MSRV, packaging and the installers.
# Release builds, the macOS app bundle and the MSI run on pushes to main and nightly only.
#
# Every action is pinned by commit SHA (the tag in the comment); Dependabot proposes updates
# (.github/dependabot.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # nightly: release builds on every target

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Debug builds in CI: no incremental state worth caching, smaller caches.
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo nextest run --workspace --locked --all-targets --no-fail-fast
      # nextest does not run doctests.
      - run: cargo test --workspace --locked --doc
      - name: CLI smoke (demo, run, show, prove)
        shell: bash
        env:
          OPROBE_DATA_DIR: ${{ runner.temp }}/oprobe-data
        run: |
          cargo build --locked
          o=target/debug/oprobe
          $o demo -d 2s
          $o run memory:// lab://clean --preset small-files -d 2s -q
          $o show --list
          $o show last --by stage
          $o prove last --with layers.tail_cut=on -q || test $? -eq 3

  deny:
    name: cargo deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      # deny.toml documents every ignored advisory (RUSTSEC-2023-0071: rsa via reqsign, signing only).
      - run: cargo deny --locked check

  docs:
    name: docs (links, CLI reference drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      # docs/cli.md is generated from the command definitions; regenerate it with
      # `OPROBE_BLESS=1 cargo test --test docs`. The same test checks relative links.
      - run: cargo test --locked --test docs
      - name: rustdoc of the library crates
        run: cargo doc --locked --no-deps -p oprobe-trace -p oprobe-core
      - name: Links (external included)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --accept 200,206,429
            --exclude-path docs/design
            --exclude 'releases/(latest/)?download'
            --exclude-loopback
            --remap 'https://github.com/hxddh/oprobe/blob/main/(.*) file://${{ github.workspace }}/$1'
            README.md README.zh-CN.md CHANGELOG.md llms.txt docs/*.md
          fail: true
      - name: Action and workflow metadata (every action pinned by SHA)
        run: |
          python3 -c "import yaml,sys; d=yaml.safe_load(open('action.yml')); assert d['runs']['using']=='composite'; print('action.yml ok:', len(d['runs']['steps']), 'steps')"
          # `uses: owner/repo@<40 hex>` only (local `./` actions excepted).
          if grep -nE '^\s*-?\s*uses:\s*[^.][^@]*@' action.yml .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}( |$)'; then
            echo "::error::actions must be pinned by commit SHA"; exit 1
          fi

  install-script:
    name: install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh scripts/test-install.sh scripts/release-manifests.sh scripts/macos-app.sh
      # install.sh against a local fake release (python http.server): latest.json, the
      # releases/latest redirect, the API, OPROBE_VERSION, PATH rc files, a checksum mismatch,
      # and the signature policy (OPROBE_VERIFY).
      - name: install.sh against a fake release
        if: runner.os != 'Windows'
        run: sh scripts/test-install.sh
      - name: install.sh under dash
        if: runner.os == 'Linux'
        run: dash -n scripts/install.sh
      - name: install.ps1 against a fake release
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: install.ps1 under Windows PowerShell 5.1 (parse)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      # The package-manager manifests from a fake asset set: valid Ruby and JSON, distinct names.
      - name: Release manifests
        if: runner.os == 'Linux'
        run: |
          d="$RUNNER_TEMP/dist"; mkdir -p "$d"; v=0.0.0-ci
          for f in universal-apple-darwin.tar.gz x86_64-unknown-linux-musl.tar.gz aarch64-unknown-linux-musl.tar.gz \
                   macos-universal.dmg x86_64-pc-windows-msvc.zip aarch64-pc-windows-msvc.zip x64.msi arm64.msi; do
            echo "$f" > "$d/oprobe-$v-$f"
          done
          (cd "$d" && sha256sum -- * > SHA256SUMS)
          scripts/release-manifests.sh "$v" "$d" hxddh/oprobe
          ruby -c "$d/oprobe.rb" && ruby -c "$d/oprobe-app.rb"
          grep -q '^class Oprobe < Formula' "$d/oprobe.rb"
          grep -q '^cask "oprobe-app" do' "$d/oprobe-app.rb"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['autoupdate']['hash']['url'].endswith('/SHA256SUMS')" "$d/oprobe.json"
          python3 -m json.tool "$d/latest.json" > /dev/null

  backends:
    name: real backends (MinIO, fake-gcs-server, Azurite)
    runs-on: ubuntu-latest
    env:
      OPROBE_IT_S3_ENDPOINT: http://127.0.0.1:9000
      OPROBE_IT_GCS_ENDPOINT: http://127.0.0.1:4443
      OPROBE_IT_AZBLOB_ENDPOINT: http://127.0.0.1:10000/oprobeit
      OPROBE_IT_AZBLOB_ACCOUNT: oprobeit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # MinIO no longer publishes container images; build a pinned revision from source.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin/minio
          key: minio-v0.0.0-20260212201848-7aac2a2c5b7c
      - name: Build MinIO
        run: |
          [ -x ~/go/bin/minio ] || go install github.com/minio/minio@v0.0.0-20260212201848-7aac2a2c5b7c
      - name: Start MinIO, fake-gcs-server and Azurite
        run: |
          # Azurite account with a key generated for this run only.
          key="$(openssl rand -base64 64 | tr -d '\n')"
          echo "::add-mask::$key"
          echo "OPROBE_IT_AZBLOB_KEY=$key" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/minio"
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup ~/go/bin/minio server "$RUNNER_TEMP/minio" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          docker run -d --name gcs -p 4443:4443 fsouza/fake-gcs-server -scheme http -public-host 127.0.0.1:4443
          docker run -d --name azurite -p 10000:10000 -e "AZURITE_ACCOUNTS=oprobeit:$key" \
            mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null \
              && curl -sf http://127.0.0.1:4443/storage/v1/b >/dev/null \
              && curl -s -o /dev/null http://127.0.0.1:10000/ && break
            sleep 1
          done
      - name: Create bucket / bucket / container
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://bench
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"name":"bench"}' http://127.0.0.1:4443/storage/v1/b
          az storage container create -n bench --connection-string \
            "DefaultEndpointsProtocol=http;AccountName=oprobeit;AccountKey=$OPROBE_IT_AZBLOB_KEY;BlobEndpoint=$OPROBE_IT_AZBLOB_ENDPOINT;"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo test --locked --test backends -- --nocapture
      - name: Container logs on failure
        if: failure()
        run: |
          echo "== minio"; tail -n 80 "$RUNNER_TEMP/minio.log" || true
          for c in gcs azurite; do echo "== $c"; docker logs --tail 80 $c || true; done

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo check --workspace --locked --all-targets

  package:
    name: cargo package (cargo install readiness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      # oprobe-trace is the published crate (oprobe-core is internal: publish = false).
      - run: cargo package -p oprobe-trace --locked
      - name: cargo install (debug profile; release builds run on main and nightly)
        run: cargo install --locked --debug --path crates/oprobe --root "$RUNNER_TEMP/inst" && "$RUNNER_TEMP/inst/bin/oprobe" --version

  gui:
    name: gui build check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - name: GTK 4 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: gui
      - run: cargo clippy --workspace --locked --all-targets --features gui -- -D warnings

  # ---------------------------------------------------------------------------------------
  # main and nightly only: release builds and installers (design v5 §10, review X7).
  # ---------------------------------------------------------------------------------------
  release-targets:
    name: release build ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-latest, target: x86_64-apple-darwin, features: gui }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, features: gui }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      # The size target of design v5 §1 (≤ 45 MB for the CLI + TUI musl binary): reported in
      # the job summary, not enforced.
      - name: Binary size
        shell: bash
        run: |
          f="target/${{ matrix.target }}/release/oprobe"; [ -f "$f.exe" ] && f="$f.exe"
          bytes=$(wc -c < "$f" | tr -d ' ')
          echo "oprobe ${{ matrix.target }}: $((bytes / 1048576)) MiB ($bytes bytes)" | tee -a "$GITHUB_STEP_SUMMARY"

  installers:
    name: app bundle + MSI (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: installers
      - run: cargo build --locked --release --features gui
      # Like the MSI below, the macOS app and disk image are otherwise only built at release
      # time; the script also opens the app through LaunchServices and fails if it does not stay up.
      - name: App bundle + disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg out
          scripts/macos-app.sh target/release/oprobe 0.0.0-ci dmg
          ln -s /Applications dmg/Applications
          size_mb=$(( $(du -sm dmg | cut -f1) * 2 + 32 ))
          hdiutil create -volname "oprobe ci" -srcfolder dmg -fs HFS+ -size "${size_mb}m" \
            -ov -format UDZO out/oprobe-ci.dmg
          hdiutil verify out/oprobe-ci.dmg
      # The MSI is otherwise only built at release time: build it here from a staged copy of
      # the archive layout, exactly as release.yml does.
      - name: MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage/oprobe"
          New-Item -ItemType Directory -Force -Path $stage, out | Out-Null
          Copy-Item target/release/oprobe.exe, README.md, CHANGELOG.md $stage
          Copy-Item LICENSE "$stage/LICENSE.txt"
          ./target/release/oprobe.exe completions powershell > "$stage/_oprobe.ps1"
          Copy-Item -Recurse profiles $stage
          dotnet tool install --global wix --version 5.0.2
          wix build packaging/windows/oprobe.wxs -arch x64 `
            -d Version=5.0.0 -d BinDir=$stage -d IconFile=packaging/desktop/oprobe.ico `
            -o out/oprobe-ci-x64.msi
          Get-Item out/oprobe-ci-x64.msi
