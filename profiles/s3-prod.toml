# Production AWS S3 Lakehouse Parquet Sparse Column Lookup Profile
[target]
name = "AWS S3 Standard Lakehouse"
scheme = "s3"

[target.options]
bucket = "replace-with-your-s3-bucket"
region = "ap-northeast-1"
endpoint = "https://s3.ap-northeast-1.amazonaws.com"
root = "/oprobe-bench"

[workload]
kind = "parquet_point_lookup"
duration_secs = 10.0
warmup_secs = 1.5
rounds = 48
object_size_mib = 8
verify_crc32c = true
enable_local_cache = true
cache_memory_mib = 256
internet_egress_ratio = 0.10
auto_cleanup = true

[knobs]
concurrent = 32
chunk_bytes = 1048576
range_gap_bytes = 262144
enable_cache = true
enable_tail_cut = true
keep_alive = true

[sla]
max_p99_ms = 180.0
min_throughput_mib_s = 120.0
max_read_amplification = 2.0

[pricing]
provider_name = "AWS S3 Standard"
storage_usd_per_gb_month = 0.023
class_a_put_list_usd_per_million = 5.00
class_b_get_head_usd_per_million = 0.40
egress_usd_per_gb = 0.09
baseline_stored_tb = 10.0
monthly_logical_access_tb = 50.0
