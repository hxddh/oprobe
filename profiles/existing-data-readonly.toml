# Read-only benchmark of objects you already have — nothing is written or deleted.
[target]
url = "s3://replace-me-bucket"

[workload]
preset = "mixed"            # write ops are dropped automatically for existing data
duration = "30s"

[workload.dataset]
existing_prefix = "warehouse/events/"
objects = 200               # sample up to objects×64 keys from the prefix

[knobs]
concurrency = 16
