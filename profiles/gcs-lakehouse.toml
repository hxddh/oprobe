# Google Cloud Storage (GCS) Metadata Prefix Discovery & Iceberg Scan Profile
[target]
name = "Google Cloud Storage Lakehouse"
scheme = "gcs"

[target.options]
bucket = "replace-with-gcs-bucket"
root = "/oprobe-bench"

[workload]
kind = "metadata_prefix_storm"
duration_secs = 10.0
rounds = 48
object_size_mib = 4
verify_crc32c = true
enable_local_cache = true
cache_memory_mib = 128
internet_egress_ratio = 0.10
auto_cleanup = true

[sla]
max_p99_ms = 160.0
min_throughput_mib_s = 40.0
max_read_amplification = 1.5

[pricing]
provider_name = "Google GCS Standard"
storage_usd_per_gb_month = 0.020
class_a_put_list_usd_per_million = 5.00
class_b_get_head_usd_per_million = 0.40
egress_usd_per_gb = 0.12
baseline_stored_tb = 10.0
monthly_logical_access_tb = 50.0
