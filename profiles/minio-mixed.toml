# Self-hosted MinIO / Ceph RGW / any S3-compatible endpoint, mixed read/write.
#   oprobe run --profile profiles/minio-mixed.toml
[target]
url = "s3://bench/oprobe"
[target.options]
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
access_key_id = "${MINIO_ROOT_USER}"
secret_access_key = "${MINIO_ROOT_PASSWORD}"
enable_virtual_host_style = "false"

[workload]
preset = "mixed"
duration = "30s"
warmup = "3s"
access = "hotset:0.2/0.8"

[knobs]
concurrency = 32
cache = true
cache_size = "512MiB"
