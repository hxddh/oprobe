# Partition discovery on Google Cloud Storage: LIST + HEAD storm over 32 partitions.
#   export GOOGLE_APPLICATION_CREDENTIALS=/path/to/sa.json
[target]
url = "gcs://replace-me-bucket/oprobe"

[workload]
preset = "metadata"
duration = "30s"

[workload.dataset]
objects = 2048
object_size = "4KiB"
partitions = 32

[knobs]
concurrency = 64

[cost]
provider = "gcs"
