[package]
name = "oprobe"
version = "1.0.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "Production white-box cloud storage stack profiler, TCP/TLS/HTTP microscope, FinOps analyzer, and SLA auto-tuner powered by Apache OpenDAL"
repository = "https://github.com/hxddh/oprobe"
readme = "README.md"
keywords = ["opendal", "s3", "benchmark", "profiler", "finops"]
categories = ["command-line-utilities", "development-tools::profiling", "filesystem"]
include = [
  "src/**/*",
  "profiles/**/*",
  "Cargo.toml",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
]

[lib]
name = "oprobe"
path = "src/lib.rs"

[[bin]]
name = "oprobe"
path = "src/main.rs"

[dependencies]
opendal = { version = "0.59", default-features = false, features = [
  "executors-tokio",
  "services-memory",
  "services-fs",
  "services-s3",
  "services-gcs",
  "services-b2",
  "services-oss",
  "services-azblob",
  "services-cos",
  "services-webdav",
  "services-http",
  "layers-retry",
  "layers-timeout",
  "layers-tail-cut",
  "layers-concurrent-limit",
  "layers-await-tree",
] }
opendal-core = { version = "0.59", default-features = false, features = [
  "executors-tokio",
  "services-memory",
] }

await-tree = "0.3"
moka = { version = "0.12", features = ["future", "sync"] }

hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
  "client",
  "client-legacy",
  "server",
  "server-auto",
  "http1",
  "http2",
  "tokio",
] }
http = "1"
http-body = "1"
http-body-util = "0.1"
tower-service = "0.3"

rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
oxitls-rustcrypto-provider = "0.3"
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "0.26"
rustls-native-certs = "0.8"

url = "2.5"
bytes = "1.10"
futures = "0.3"
tokio = { version = "1.52", features = [
  "rt-multi-thread",
  "net",
  "sync",
  "time",
  "macros",
  "fs",
  "io-util",
  "signal",
] }
hdrhistogram = "7.5"
crc32c = "0.6"
rand = "0.8"
rand_xoshiro = "0.6"
sysinfo = "0.32"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"

# Optimize third-party crypto/TLS/HTTP dependencies in dev & test profiles so pure-Rust
# TLS 1.3 (AES-GCM/GHASH/SHA-2/P-256) and CRC32C run at native speed across CI runners.
[profile.dev.package."*"]
opt-level = 2

