[package]
name = "oprobe"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "White-box storage stack profiler, socket/TLS micro-probe, FinOps analyzer, and SLA auto-tuner powered by Apache OpenDAL"
repository = "https://github.com/hxddh/oprobe"
homepage = "https://github.com/hxddh/oprobe"
readme = "README.md"
keywords = ["opendal", "s3", "benchmark", "profiler", "tui"]
categories = ["command-line-utilities", "development-tools::profiling", "filesystem"]

[lib]
name = "oprobe"
path = "src/lib.rs"

[[bin]]
name = "oprobe"
path = "src/main.rs"

[dependencies]
opendal = { version = "0.59", features = [
  "services-memory",
  "services-fs",
  "services-s3",
  "services-gcs",
  "services-b2",
  "services-oss",
  "services-azblob",
  "services-cos",
  "services-webdav",
  "layers-retry",
  "layers-timeout",
  "layers-tail-cut",
  "layers-concurrent-limit",
  "layers-foyer",
  "layers-await-tree",
] }
opendal-core = "0.59"

await-tree = "0.3"
foyer = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
http = "1"
url = "2.5"
bytes = "1.10"
futures = "0.3"
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util", "signal"] }
hdrhistogram = "7.5"
crc32c = "0.6"
rand = "0.8"
rand_xoshiro = "0.6"
sysinfo = "0.32"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"
