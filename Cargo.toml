[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "9.3.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/hxddh/oprobe"
documentation = "https://github.com/hxddh/oprobe/tree/main/docs"

[workspace.dependencies]
# Path dependencies: only oprobe-trace is published (the binary and its engine are not), so
# nothing pins a version here. oprobe-core uses oprobe-trace's internals (`__internal`).
oprobe-trace = { path = "crates/oprobe-trace", features = ["__internal"] }
oprobe-core = { path = "crates/oprobe-core", default-features = false }

opendal = { version = "0.59", default-features = false }
opendal-core = { version = "0.59", default-features = false }
opendal-layer-retry = "0.59"
await-tree = "0.3"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server", "server-auto", "http1", "http2", "tokio"] }
http = "1"
http-body = "1"
httpdate = "1"
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws_lc_rs"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-platform-verifier = "0.7"
# The same client OpenDAL uses by default (opendal-http-transport-reqwest: rustls + stream);
# `http2` is compiled in but only negotiated when `knobs.http = "h2"`.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"] }
tower-layer = "0.3"
tower-service = "0.3"
url = "2.5"
bytes = "1.10"
futures = "0.3"
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util", "signal", "process"] }
hdrhistogram = "7.5"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
schemars = "1"
anyhow = "1.0"
libc = "0.2"
toml = "0.8"
toml_edit = "0.22"
crc32c = "0.6"
zstd = "0.14"
dirs = "7"
sha2 = "0.11"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Console", "Win32_Networking_WinSock"] }
tempfile = "3"

# Release: one codegen unit, fat LTO, stripped (design v5 §1). Size has no hard target: it must
# not cost usability or function.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Pure-Rust crypto (TLS, CRC32C) is far too slow unoptimized; keep dependencies fast in dev/test.
# Line tables keep backtraces useful at a fraction of full debug info's disk and link time.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
