[package]
name = "oprobe-trace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/oprobe-trace"
description = "Profile any Apache OpenDAL operator in production: one layer times every backend request by stage, keeps bounded aggregates and writes .oprobe files the oprobe workbench opens"
readme = "README.md"
keywords = ["opendal", "profiler", "tracing", "s3", "observability"]
categories = ["development-tools::profiling", "network-programming"]
include = ["src/**/*", "tests/**/*", "benches/**/*", "Cargo.toml", "README.md", "LICENSE"]

[package.metadata.docs.rs]
features = ["otel", "schemars"]

[features]
default = []
# OpenTelemetry metrics (`http.client.request.duration` with `oprobe.stage`/`oprobe.api`).
otel = ["dep:opentelemetry"]
# `schemars::JsonSchema` for the snapshot types.
schemars = ["dep:schemars"]
# For the oprobe binary only (no semver promise): exposes the recorder, rows and transport
# internals, lifts `#[non_exhaustive]`, and adds the lab's TLS acceptor.
__internal = ["schemars", "dep:tokio-rustls"]

[dependencies]
opendal-core = { workspace = true, features = ["executors-tokio"] }
# `RetryInterceptor`, for `Handle::retry_notify` (the crate OpenDAL's `RetryLayer` comes from).
opendal-layer-retry.workspace = true
await-tree.workspace = true
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy"] }
http.workspace = true
http-body.workspace = true
httpdate.workspace = true
# The same TLS stack as OpenDAL's default reqwest client (rustls with aws-lc-rs).
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-platform-verifier.workspace = true
reqwest.workspace = true
tower-layer.workspace = true
tower-service.workspace = true
url.workspace = true
bytes.workspace = true
futures.workspace = true
tokio = { version = "1.52", features = ["rt", "net", "sync", "time", "macros"] }
hdrhistogram.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
libc.workspace = true
schemars = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"], optional = true }

[target."cfg(windows)".dependencies]
windows-sys.workspace = true

[dev-dependencies]
opendal-core = { workspace = true, features = ["executors-tokio", "services-memory"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "testing"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "io-util"] }
# The overhead bench's HTTP line: OpenDAL's `http` service and its default reqwest client.
opendal-service-http = "0.59"
opendal-service-fs = "0.59"
opendal-http-transport-reqwest = "0.59"

[[bench]]
name = "overhead"
harness = false
