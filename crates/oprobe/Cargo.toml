[package]
name = "oprobe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
description = "A profiler for Apache OpenDAL operators: what your Operator does on the wire, the layer that fixes it, and an A/B test that proves the fix"
readme = "../../README.md"
keywords = ["opendal", "s3", "benchmark", "profiler", "object-storage"]
categories = ["command-line-utilities", "development-tools::profiling"]
include = ["build.rs", "src/**/*", "Cargo.toml", "LICENSE"]
default-run = "oprobe"

# The front ends (CLI and app) over `oprobe_core::app`. The library target exists for the
# integration tests; embed `oprobe-trace` instead.
[lib]
name = "oprobe"
path = "src/lib.rs"
doc = false

[[bin]]
name = "oprobe"
path = "src/main.rs"

[features]
default = ["app", "cli"]
# The CLI with the common cloud services and without the app: the CLI-only release archives
# (`--no-default-features --features cli`). `--no-default-features` alone drops the services too.
cli = ["default-services"]
# The app (bare `oprobe`): the nsh workbench in any terminal (no GUI toolkit needed).
app = [
  "dep:nsh-core",
  "dep:nsh-base",
  "dep:nsh-platform-tui",
  "dep:ratatui-core",
  "dep:ratatui-crossterm",
  "dep:crossterm",
]
# Native windows for the app (AppKit / Win32 / GTK 4; Linux builds need libgtk-4-dev). Only a
# window draws the icons' SVG (a terminal shows glyphs), so the SVG renderer (resvg and its
# font stack) is built with this feature alone.
gui = [
  "app",
  "nsh-core/svg",
  "dep:nsh-platform-linux",
  "dep:nsh-platform-macos",
  "dep:nsh-platform-windows",
]
# OpenDAL services: the common clouds by default; `all-services` adds the rest.
default-services = ["oprobe-core/default-services"]
all-services = ["oprobe-core/all-services"]
otel = ["oprobe-core/otel"]

[dependencies]
oprobe-core.workspace = true
futures.workspace = true
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
schemars.workspace = true

# The app (Native Shell): the terminal workbench (`app`, default) and native windows (`gui`).
nsh-core = { version = "0.7", optional = true }
nsh-base = { version = "0.7", default-features = false, optional = true }
nsh-platform-tui = { version = "0.7", default-features = false, features = ["run-app"], optional = true }
ratatui-core = { version = "0.1", optional = true }
ratatui-crossterm = { version = "0.1", optional = true }
crossterm = { version = "0.29", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.7", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.7", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.7", default-features = false, optional = true }

[target."cfg(windows)".dependencies]
windows-sys.workspace = true

[dev-dependencies]
opendal = { workspace = true, features = ["executors-tokio", "services-memory"] }
http.workspace = true
reqwest.workspace = true
nsh-engine ={ version = "0.7", default-features = false }
nsh-testing = { version = "0.7", default-features = false }
opendal-http-transport-reqwest = "0.59"
tempfile.workspace = true
jsonschema = { version = "0.61", default-features = false }
opendal-core = { workspace = true, features = ["executors-tokio", "services-memory"] }
await-tree.workspace = true
toml.workspace = true
libc.workspace = true
zstd.workspace = true

# ---------------------------------------------------------------------------------------
# Native packages (built by .github/workflows/release.yml).
# ---------------------------------------------------------------------------------------
[package.metadata.deb]
maintainer = "oprobe maintainers <noreply@github.com>"
section = "utils"
priority = "optional"
extended-description = """\
oprobe is a profiler for Apache OpenDAL operators: it traces every backend request of an \
Operator (queue, connect, send, time-to-first-byte, body, backoff), names the layer that \
fixes what it finds, and proves the fix with an interleaved A/B test."""
assets = [
  ["target/release/oprobe", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/oprobe/README.md", "644"],
  ["../../CHANGELOG.md", "usr/share/doc/oprobe/CHANGELOG.md", "644"],
]

[package.metadata.generate-rpm]
summary = "A profiler for Apache OpenDAL operators"
license = "Apache-2.0"
assets = [
  { source = "target/release/oprobe", dest = "/usr/bin/oprobe", mode = "755" },
  { source = "../../README.md", dest = "/usr/share/doc/oprobe/README.md", mode = "644", doc = true },
]
