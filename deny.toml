# cargo-deny configuration (supply chain): advisories, licenses, bans and
# sources of every crate in the workspace. CI runs `cargo deny check` (.github/workflows/ci.yml).
# Run it locally with `cargo install cargo-deny --locked && cargo deny check`.

[graph]
# Every platform a release is built for: a dependency only used on Windows or macOS is checked too.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # rsa 0.9 (Marvin attack, a timing side channel on RSA *decryption*). It comes in through
  # reqsign (OpenDAL's request signer), which only *signs* a handful of JWTs locally for GCS
  # service accounts; oprobe never decrypts with RSA and never signs attacker-chosen data on
  # request, so the side channel is not observable. No patched rsa exists for reqsign 3.x;
  # drop this entry once OpenDAL moves to rsa >= 0.10.
  { id = "RUSTSEC-2023-0071", reason = "signing only, no RSA decryption; no fix available upstream (reqsign 3.x)" },
  # Unmaintained crates pulled in by the terminal/native UI toolkit (nsh): syntax highlighting
  # (syntect -> bincode), dates (chrono) and SVG fonts (resvg -> ttf-parser; nsh 0.7 shapes with
  # harfrust, so rustybuzz is gone).
  # None of them parses untrusted network input; they are tracked for replacement upstream.
  { id = "RUSTSEC-2025-0141", reason = "bincode via syntect (UI toolkit); only bundled syntax sets are decoded" },
  { id = "RUSTSEC-2026-0543", reason = "chrono via nsh (UI toolkit); no known vulnerability" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser via resvg (UI toolkit); parses bundled fonts only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses compatible with distributing oprobe under Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  # option-ext (via dirs): file-level copyleft, used unmodified.
  "MPL-2.0",
  # aws-lc-sys bundles OpenSSL-derived code.
  "OpenSSL",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace carry a version too, so they are not wildcards.
allow-wildcard-paths = true
deny = [
  # The TLS stack is rustls everywhere; native OpenSSL would change what is measured.
  { name = "openssl-sys", reason = "rustls only (design v3 §4)" },
  { name = "native-tls", reason = "rustls only (design v3 §4)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
